<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Penawaran untuk PIP Machinery dan Purnama Eskrim</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<style>
  :root {
    /* Palet: Seal Blue (primer), Navy Blue (sekunder), Oranye (aksen) */
    --seal: #dbf2fc;
    --navy: #072d59;
    --accent: #ea580c;
    --blue: var(--navy);          /* teks, tag, dan tombol sekunder */
    --night: var(--navy);         /* latar slide gelap */
    --deep: #072d59;              /* teks di atas latar terang */
    --orange: var(--accent);      /* aksen oranye */
    --orange-soft: #ffa268;
    --paper: var(--seal);         /* latar slide terang */
    --panel: #ffffff;             /* kartu di atas Seal Blue */
    --card: #eaf7fd;              /* latar dalam mockup */
    --line: #b6dcee;
    --muted: #3f5a78;
    --night-line: rgba(219,242,252,.28);
    --night-soft: #ffffff;        /* teks di atas warna: putih */
    --font: "Satoshi", "Segoe UI", sans-serif;
    --r-frame: 28px;
    --r-card: 18px;
    --t: min(3.3vw, 6.2vh);      /* ukuran judul slide */
  }
  * { box-sizing: border-box; font-synthesis: none; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--font); font-size: clamp(15px, 1.12vw, 18px); line-height: 1.45; color: var(--deep); background: var(--night); }
  h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  img { display: block; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  h1:focus, h2:focus { outline: none; }
  .arrow { width: 1em; height: 1em; display: block; }

  /* ---------- Slide dan bingkai ---------- */
  .slide { min-height: 100dvh; padding: 18px 18px 84px; display: flex; }
  .slide.dark { background: var(--night); color: #fff; }
  .slide.light { background: var(--paper); color: var(--deep); }
  .frame { flex: 1; display: flex; flex-direction: column; border-radius: var(--r-frame); padding: 18px 28px 28px; min-height: 0; }
  .dark .frame { box-shadow: inset 0 0 0 1.5px var(--night-line); }
  .light .frame { box-shadow: inset 0 0 0 1.5px var(--line); }
  .head { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; align-items: center; gap: 16px; font-size: 14px; font-weight: 500; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand img { width: 30px; height: 30px; object-fit: cover; object-position: 8% 50%; border-radius: 8px; background: #fff; }
  .head .contact { border-radius: 999px; padding: 8px 16px; font-weight: 700; white-space: nowrap; }
  .dark .head .contact { box-shadow: inset 0 0 0 1.5px var(--orange); color: #fff; }
  .light .head .contact { box-shadow: inset 0 0 0 1.5px var(--blue); color: var(--blue); }
  .content { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  h1 { font-size: min(6.4vw, 11.5vh); font-weight: 900; line-height: .98; letter-spacing: -.035em; }
  h2 { font-size: var(--t); font-weight: 900; line-height: 1.04; letter-spacing: -.03em; }
  h3 { font-size: clamp(17px, 1.35vw, 22px); font-weight: 900; line-height: 1.15; letter-spacing: -.01em; }
  .lead { font-size: clamp(16px, 1.3vw, 21px); line-height: 1.45; }
  .dark .soft { color: var(--night-soft); }
  .light .soft { color: var(--muted); }
  .small { font-size: clamp(13px, .95vw, 15px); line-height: 1.45; }
  .dark .life .soft, .dark .card.white .soft { color: var(--muted); }
  .light .tbl { background: var(--panel); }
  .light .photo { background: var(--panel); }
  .num { font-weight: 900; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }

  /* Tombol pil dengan panah bulat */
  .pill-btn { display: inline-flex; align-items: center; gap: 14px; border: 0; border-radius: 999px; padding: 7px 7px 7px 22px; font-weight: 700; background: var(--orange); color: #fff; transition: transform .18s ease, background-color .18s ease; }
  .pill-btn i { width: 40px; height: 40px; border-radius: 50%; background: var(--deep); color: #fff; display: grid; place-items: center; font-size: 18px; transition: transform .25s ease; }
  .pill-btn:hover { background: #c2410c; }
  .pill-btn:hover i { transform: translateX(3px) rotate(-45deg); }
  .pill-btn:active { transform: scale(.98); }
  .tag { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 5px 6px 5px 16px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .tag i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
  .light .tag, .tag.solid { background: var(--blue); color: #fff; }
  .light .tag i, .tag.solid i { background: #fff; color: var(--blue); }
  .tag.line { background: none; color: #fff; box-shadow: inset 0 0 0 1.5px #fff; }
  .tag.line i { background: #fff; color: var(--orange); }
  button.tag { border: 0; transition: transform .15s ease, background-color .15s ease; }
  button.tag:hover { transform: translateY(-1px); }
  .tag[aria-pressed="false"] { background: var(--panel); color: var(--blue); }
  .tag[aria-pressed="false"] i { background: var(--blue); color: #fff; }

  .card { border-radius: var(--r-card); padding: 20px; }
  .light .card { background: var(--panel); }
  .dark .card.white { background: #fff; color: var(--deep); }
  .card.orange { background: var(--orange); color: #fff; }
  .card.blue { background: var(--blue); color: #fff; }
  .card.night { background: rgba(255,255,255,.07); color: #fff; }
  .card.orange .card-top, .card .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .round-arrow { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 16px; }
  .orange .round-arrow { background: #fff; color: var(--orange); }
  .light .round-arrow { background: var(--blue); color: #fff; }
  .hover-lift { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease; }
  .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(0,20,60,.18); }
  .photo { border-radius: var(--r-card); overflow: hidden; background: #fff; position: relative; }
  .photo { min-height: 200px; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo.contain img { object-fit: contain; padding: 14px; }
  .dot-list li { position: relative; padding-left: 22px; margin-top: 10px; }
  .dot-list li::before { content: ""; position: absolute; left: 0; top: .42em; width: 11px; height: 11px; border-radius: 50%; background: var(--orange); }

  /* ---------- Gerak masuk ---------- */
  .rise { opacity: 0; transform: translateY(22px); }
  .slide.on .rise { animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .slide.on .d1 { animation-delay: .08s; } .slide.on .d2 { animation-delay: .16s; } .slide.on .d3 { animation-delay: .24s; }
  .slide.on .d4 { animation-delay: .32s; } .slide.on .d5 { animation-delay: .40s; } .slide.on .d6 { animation-delay: .48s; }
  .line-draw { transform: scaleX(0); transform-origin: left center; }
  .slide.on .line-draw { animation: draw 1.2s .3s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes draw { to { transform: none; } }
  .bar-fill { transform: scaleX(0); transform-origin: left center; }
  .slide.on .bar-fill { animation: draw .9s .35s cubic-bezier(.2,.8,.2,1) forwards; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .line-draw, .bar-fill { opacity: 1 !important; transform: none !important; animation: none !important; }
    * { transition: none !important; }
  }

  /* ---------- Tata letak tiap slide ---------- */
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .g { display: grid; gap: 16px; min-height: 0; }
  .fill { flex: 1; min-height: 0; }

  .cover-top { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; align-items: center; padding: 10px 0 22px; }
  .cover-band { flex: 1; min-height: 240px; border-radius: 22px; overflow: hidden; position: relative; background: #fff; display: grid; grid-template-columns: 1.7fr 1fr; }
  .float { position: absolute; z-index: 3; border-radius: 16px; box-shadow: 0 18px 40px rgba(0,20,60,.3); }
  .float-note { right: 24px; top: 22px; background: #fff; color: var(--deep); padding: 12px 16px; display: flex; gap: 12px; align-items: center; animation: bob 5s ease-in-out infinite; }
  .float-note i { width: 38px; height: 38px; border-radius: 50%; background: var(--orange); display: grid; place-items: center; color: #fff; font-style: normal; font-weight: 900; }
  .float-note b { display: block; }
  .float-stat { left: 22px; bottom: 22px; background: var(--orange); color: #fff; padding: 12px 18px; animation: bob 6s 1s ease-in-out infinite; }
  .float-stat b { font-size: 28px; font-weight: 900; display: block; line-height: 1; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .timeline { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding-top: 34px; }
  .timeline::before { content: none; }
  .tl-line { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--orange); border-radius: 3px; }
  .tl-step { position: relative; }
  .tl-step::before { content: ""; position: absolute; left: 22px; top: -31px; width: 18px; height: 18px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 5px var(--seal); }
  .tl-step .tag { margin-bottom: 14px; }

  .life { background: #fff; color: var(--deep); border-radius: var(--r-card); padding: 20px 22px; display: flex; flex-direction: column; }
  .life ol { position: relative; margin-top: 14px; }
  .life ol::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--orange); }
  .life li { position: relative; padding: 0 0 12px 26px; }
  .life li::before { content: ""; position: absolute; left: 0; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); }
  .life li b { display: block; }

  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--line); }
  .tbl th { background: var(--blue); color: #fff; text-align: left; font-weight: 700; padding: 11px 16px; font-size: 15px; }
  .tbl td { padding: 10px 16px; border-top: 1.5px solid var(--line); vertical-align: top; font-size: clamp(14px, 1vw, 16px); line-height: 1.38; }
  .tbl td + td { font-weight: 700; }

  .stat-card b.num { font-size: min(3.6vw, 6vh); display: block; }
  .shot { border-radius: 14px; overflow: hidden; position: relative; background: #fff; }

  .bars .b { display: grid; grid-template-columns: 90px 1fr 70px; gap: 12px; align-items: center; margin-top: 12px; font-weight: 700; }
  .bars .track { height: 22px; background: var(--seal); border-radius: 6px; overflow: hidden; }
  .bars .bar-fill { height: 100%; background: var(--blue); border-radius: 6px; }
  .bars .b:nth-child(odd) .bar-fill { background: var(--orange); }
  .prog { display: grid; grid-template-columns: 1fr 64px; gap: 12px; align-items: center; margin-top: 10px; }
  .prog .p-label { background: var(--navy); color: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; position: relative; overflow: hidden; }
  .prog .p-label .bar-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--orange); border-radius: 999px; }
  .prog .p-label span { position: relative; }

  .contacts { display: grid; gap: 10px; }
  .contacts a, .contacts span { display: flex; align-items: center; gap: 12px; background: var(--orange); color: #fff; border-radius: 999px; padding: 6px 18px 6px 6px; font-weight: 700; }
  .contacts i { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--orange); display: grid; place-items: center; font-style: normal; font-size: 15px; }

  .field-row { display: block; margin-top: 16px; font-weight: 500; }
  .field-row output { font-weight: 900; float: right; }
  .field-row input { width: 100%; margin-top: 8px; accent-color: var(--orange); height: 24px; }

  .demo-frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* ---------- Mockup tampilan produk (data-ui) ---------- */
  .frag { position: relative; overflow: hidden; width: 100%; height: 100%; min-height: 0; }
  .frag > .frag-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  [data-ui] { font-family: var(--font); color: #18233a; text-align: left; line-height: 1.35; }
  [data-ui] h4, [data-ui] p { margin: 0; }
  .ui-site { width: 1120px; background: #fff; }
  .w-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 30px; }
  .w-nav img { height: 52px; width: auto; }
  .w-links { display: flex; gap: 24px; font-weight: 500; font-size: 16px; align-items: center; }
  .w-links b { background: var(--orange); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; }
  .w-hero { background: var(--blue); color: #fff; display: grid; grid-template-columns: 1.1fr 1fr; padding: 34px 30px 0; gap: 14px; margin: 0 16px; border-radius: 18px 18px 0 0; }
  .w-hero h4 { font-size: 50px; font-weight: 900; line-height: 1; letter-spacing: -.03em; }
  .w-hero p { color: #fff; font-size: 18px; margin: 14px 0 20px; }
  .w-cta { display: flex; gap: 10px; padding-bottom: 32px; }
  .w-cta span { padding: 12px 20px; font-weight: 700; font-size: 16px; background: rgba(255,255,255,.14); border-radius: 999px; }
  .w-cta span:first-child { background: var(--orange); color: #fff; }
  .w-hero-img { background: #fff; align-self: end; padding: 12px; border-radius: 14px 14px 0 0; }
  .w-hero-img img { width: 100%; height: 250px; object-fit: contain; animation: bob 6s ease-in-out infinite; }
  .w-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 18px 30px 26px; }
  .w-cat { background: var(--card); padding: 12px; border-radius: 14px; transition: transform .2s ease; }
  .w-cat img { width: 100%; height: 100px; object-fit: contain; }
  .w-cat b { display: block; font-size: 16px; margin-top: 6px; }
  .w-cat small { font-size: 14px; color: #4c5870; }

  .ui-screen { width: 360px; height: 720px; background: #fff; display: flex; flex-direction: column; }
  .p-head { background: var(--blue); color: #fff; padding: 20px 20px 18px; }
  .p-head small { display: block; font-size: 15px; color: #fff; opacity: .9; }
  .p-head b { font-size: 26px; font-weight: 900; line-height: 1.08; display: block; letter-spacing: -.01em; }
  .p-body { flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; }
  .p-photo { background: var(--card); padding: 10px; border-radius: 14px; }
  .p-photo img { width: 100%; height: 180px; object-fit: contain; }
  .p-name { font-size: 25px; font-weight: 900; line-height: 1.1; color: var(--blue); }
  .p-spec { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  .p-spec dt { color: #4c5870; }
  .p-spec dd { margin: 0; font-weight: 700; text-align: right; }
  .p-btn { display: block; text-align: center; padding: 14px; font-weight: 700; background: var(--orange); color: #fff; border-radius: 999px; }
  .p-btn.alt { background: var(--card); color: var(--blue); }
  .p-foot { margin-top: auto; display: grid; gap: 8px; }
  .p-track li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding-bottom: 16px; position: relative; }
  .p-track li::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-top: 2px; box-shadow: inset 0 0 0 2px #b9c4d8; z-index: 1; }
  .p-track li::after { content: ""; position: absolute; left: 8px; top: 20px; bottom: 0; width: 2px; background: #d6deeb; }
  .p-track li:last-child::after { display: none; }
  .p-track li.done::before { background: var(--blue); box-shadow: none; }
  .p-track li.now::before { background: var(--orange); box-shadow: none; animation: ring 1.8s ease-out infinite; }
  .p-track b { display: block; font-size: 17px; }
  .p-track small { color: #4c5870; font-size: 14px; }
  .p-alert { background: #ffe8d9; padding: 12px 14px; font-weight: 500; border-radius: 12px; }
  .p-item { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; }
  .p-item img { width: 58px; height: 58px; object-fit: contain; background: var(--card); border-radius: 12px; }
  .p-item b { display: block; font-size: 16px; line-height: 1.2; }
  .p-item small { color: #4c5870; font-size: 14px; }
  .p-action { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 14px; font-weight: 700; border-radius: 12px; }
  .p-action span { color: var(--blue); }

  .a-shell { width: 1120px; height: 600px; display: grid; grid-template-columns: 200px 1fr; background: #eef2f8; font-size: 15px; }
  .a-side { padding: 16px 14px; display: flex; flex-direction: column; gap: 4px; }
  .a-side img { height: 48px; width: auto; align-self: flex-start; margin-bottom: 14px; mix-blend-mode: multiply; }
  .a-side span { padding: 8px 10px; font-weight: 500; display: flex; justify-content: space-between; border-radius: 8px; }
  .a-side span.on { background: #dbe3f1; font-weight: 700; color: var(--blue); }
  .a-side em { font-style: normal; color: #4c5870; }
  .a-sheet { position: relative; background: #fff; margin: 10px 10px 10px 0; border: 1px solid #e1e6ef; border-radius: 14px; padding: 20px 22px; overflow: hidden; }
  .a-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .a-title h4 { font-size: 27px; font-weight: 900; color: var(--blue); }
  .a-title b { background: var(--blue); color: #fff; padding: 8px 14px; font-size: 14px; border-radius: 999px; }
  .a-title small { color: #4c5870; font-size: 14px; font-weight: 500; }
  .a-tabs { display: flex; gap: 20px; box-shadow: inset 0 -1px 0 #e1e6ef; margin-bottom: 4px; }
  .a-tabs span { padding: 0 0 9px; color: #4c5870; font-weight: 500; }
  .a-tabs span.on { color: var(--blue); font-weight: 700; box-shadow: inset 0 -2px 0 var(--orange); }
  .a-table { width: 100%; border-collapse: collapse; }
  .a-table th { font-weight: 500; color: #4c5870; font-size: 14px; text-align: left; padding: 9px 8px 9px 0; }
  .a-table td { padding: 12px 8px 12px 0; border-top: 1px solid #edf0f5; vertical-align: top; }
  .a-table td b { display: block; font-weight: 700; }
  .a-table td small { color: #4c5870; font-size: 13px; }
  .a-pill { display: inline-block; padding: 4px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; background: #eef2f8; color: var(--blue); border-radius: 999px; }
  .a-pill.new { background: var(--blue); color: #fff; }
  .a-pill.hot { background: #ffe8d9; color: #b4410b; }
  .a-kpis { display: grid; grid-template-columns: repeat(4, 1fr); background: #f5f7fb; margin-bottom: 16px; border-radius: 12px; }
  .a-kpis div { padding: 14px 16px; }
  .a-kpis small { display: block; color: #4c5870; font-size: 14px; }
  .a-kpis b { display: block; font-size: 28px; font-weight: 900; line-height: 1.15; color: var(--blue); }
  .a-cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; }
  .a-cols h5 { margin: 0 0 10px; font-size: 17px; font-weight: 900; color: var(--blue); }
  .a-bar { display: grid; grid-template-columns: 110px 1fr 84px; gap: 10px; align-items: center; margin-bottom: 9px; }
  .a-bar i { display: block; height: 18px; background: var(--blue); border-radius: 4px; transform-origin: left center; }
  .slide.on .a-bar i { animation: draw 1s .3s cubic-bezier(.2,.8,.2,1) both; }
  .a-bar b { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .a-list p { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #edf0f5; }
  .a-list p:first-of-type { border-top: 0; }
  .a-list small { color: #b4410b; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .a-toast { position: absolute; right: 16px; bottom: 16px; background: var(--blue); color: #fff; font-weight: 700; padding: 12px 16px; border-radius: 12px; border-left: 6px solid var(--orange); box-shadow: 0 10px 24px rgba(0,30,82,.25); z-index: 2; }
  .slide.on .a-toast { animation: pop .6s 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .slide.on .a-table tr.fresh td { animation: flash 2.6s 1.4s ease-out both; }

  .c-head { display: flex; align-items: center; gap: 12px; }
  .c-logo { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 50%; padding: 3px; }
  .c-body { flex: 1; background: #edf1f8; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; overflow: hidden; }
  .bub { max-width: 86%; padding: 10px 12px; line-height: 1.38; background: #fff; border-radius: 3px 14px 14px 14px; }
  .bub.out { align-self: flex-end; background: #d6e4fa; border-radius: 14px 3px 14px 14px; }
  .slide.on .seq { animation: pop .5s cubic-bezier(.2,.8,.2,1) both; }
  .c-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .c-card b { text-align: right; }

  @media (prefers-reduced-motion: reduce) { .seq, .a-toast, .a-table td, .a-bar i, .p-track li::before, .w-hero-img img, .pulse-btn, .c-btn, .float { animation: none !important; } }

  /* ---------- Navigasi ---------- */

  .pager button { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 18px; transition: transform .15s ease, background-color .15s ease; }

  /* Pilihan paket */
  .pk-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; flex: 1; min-height: 0; }
  .pk { background: #fff; border-radius: 22px; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; transition: background-color .25s ease, color .25s ease, transform .25s ease; }

  .pk.on { background: var(--navy); color: #fff; }
  .pk-sel { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 6px; border-radius: 12px; }

  .pk-note { margin-top: 14px; max-width: 110ch; }

  .erp-list { display: grid; gap: 4px; }

  .erp-pick svg { width: 18px; height: 18px; opacity: .7; }

  .erp-box { min-height: 0; }

  /* ---------- Minimalis: lebih sedikit elemen, lebih banyak ruang ---------- */

  .light .head .contact { color: var(--navy); }
  h1 { font-weight: 700; letter-spacing: -.04em; }
  h2 { font-weight: 700; letter-spacing: -.03em; }
  h3 { font-weight: 700; }
  .num { font-weight: 700; }

  .dark .tag[aria-pressed="false"] { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px var(--night-line); }

  .dark .card.orange::before { content: ""; display: block; width: 28px; height: 3px; border-radius: 2px; background: var(--orange); margin-bottom: 16px; }

  .tl-step .label { display: block; font-size: 16px; font-weight: 700; opacity: 1; color: var(--navy); margin-bottom: 8px; }

  .tbl td { border-top: 0; border-bottom: 1px solid var(--line); padding: 12px 16px 12px 0; }
  .life { box-shadow: none; }
  .float-note { box-shadow: 0 12px 30px rgba(7,45,89,.18); }
  .pill-btn { padding: 6px 6px 6px 20px; font-weight: 500; }
  .pill-btn i { width: 36px; height: 36px; }
  .contacts a, .contacts span { font-weight: 500; }
  .pager { padding: 4px; gap: 6px; box-shadow: 0 6px 20px rgba(7,45,89,.15); }
  .pager button { width: 34px; height: 34px; font-size: 15px; }
  .pager .where { min-width: 180px; font-weight: 500; font-size: 13px; }
  .progress { height: 2px; }
  .rise { transform: translateY(12px); }

  /* ---------- HP ---------- */
  @media (max-width: 900px) {
    :root { --t: 30px; }
    body { font-size: 16px; }
    .slide { padding: 10px 10px 80px; }

    .head { grid-template-columns: 1fr auto; }

    .head .contact { padding: 6px 12px; font-size: 13px; }
    h1 { font-size: 38px !important; }
    .num[style*="font-size"] { font-size: 34px !important; }
    .cover-top, .split, .g { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; }
    .g > * { grid-column: auto !important; grid-row: auto !important; }
    .cover-band { grid-template-columns: minmax(0, 1fr); min-height: 0; }
    .cover-band .frag-wrap { height: 420px; overflow: hidden; }
    .card.orange.fill { grid-template-columns: minmax(0, 1fr) !important; gap: 26px !important; }
    .demo-frame { height: 640px; }
    .slide h2[style*="font-size"] { font-size: 30px !important; }
    .erp-pick { padding: 9px 10px; }
    .pk-grid { grid-template-columns: minmax(0, 1fr); }
    .pk:nth-child(3) { order: -1; }
    .pk-price { font-size: 34px; }
    .cover-band .photo { height: 200px; }
    .timeline { grid-template-columns: minmax(0, 1fr); padding-top: 0; padding-left: 28px; }
    .tl-line { left: 8px; right: auto; top: 0; bottom: 0; width: 3px; height: auto; }
    .tl-step::before { left: -28px; top: 4px; }

  { name: 'Bisnis', price: 'Rp 10 juta', for: 'Supaya semua penjualan tercatat rapi.', items: [
    'Semua isi paket Website', 'ERP: Dasbor, Penjualan, Prospek, dan Stok', 'Satu nomor WhatsApp untuk banyak admin',
    'Pengingat follow up calon pembeli', 'Lacak pesanan untuk pelanggan'] },
  { name: 'Lengkap', price: 'Rp 13 juta', for: 'Supaya pelanggan terus kembali memesan.', rec: true, items: [
    'Semua isi paket Bisnis', 'ERP: Produksi Gerobak, Servis, dan Keuangan', 'Halaman mitra dan pengingat pesan ulang',
    'QR di setiap mesin untuk tutorial dan garansi', 'Laporan bulanan untuk pemilik'] }
];
if (state.paket === undefined) state.paket = 2;
SLIDES.push({ id: 'harga', title: 'Pilihan paket', theme: 'light', html: function () {
  return '<div class="row" style="margin:4px 0 16px"><h2 class="rise" tabindex="-1">Pilihan Paket</h2><p class="small soft rise d1" style="max-width:40ch">Semua paket selesai dalam <b>1 bulan</b>. Pilih yang paling pas, bisa naik paket kapan saja.</p></div>' +
    '<div class="pk-grid">' + PAKET.map(function (p, i) {
      var on = state.paket === i, msg = encodeURIComponent('Halo Dar, saya tertarik dengan Paket ' + p.name + ' (' + p.price + ') untuk PIP Machinery.');
      return '<div class="pk rise d' + (i + 2) + (on ? ' on' : '') + '">' +
        '<button class="pk-sel" type="button" data-paket="' + i + '" aria-pressed="' + on + '">' +
          '<span class="pk-top"><h3>Paket ' + p.name + '</h3>' + (p.rec ? '<span class="pk-badge">Paling lengkap</span>' : '') + '</span>' +
          '<span class="small pk-for">' + p.for + '</span>' +
          '<b class="num pk-price">' + p.price + '</b><span class="small pk-for">Sekali bayar · selesai 1 bulan</span></button>' +
        '<ul class="pk-list">' + p.items.map(function (it) { return '<li>' + it + '</li>'; }).join('') + '</ul>' +
        '<a class="pk-cta" href="https://wa.me/' + SENDER.wa + '?text=' + msg + '" target="_blank" rel="noopener">Ambil paket ini</a></div>'; }).join('') + '</div>' +
    '<p class="small soft rise d5 pk-note"><b>Semua paket sudah termasuk:</b> pelatihan tim, panduan video, dan pendampingan 3 bulan gratis (lalu Rp 500 ribu per bulan). Bayar 50% di awal dan 50% saat serah terima. Domain, hosting, dan WhatsApp API ditagihkan terpisah atas nama Bapak/Ibu.</p>'; } });

/* Urutan ringkas: solusi, bukti, harga, lalu penutup */
var ORDER = ['mulai', 'solusi', 'erp', 'mockup-website', 'mockup-pelanggan', 'demo', 'harga', 'komitmen', 'penutup'];
SLIDES = ORDER.map(function (id) { return SLIDES.filter(function (s) { return s.id === id; })[0]; });

/* ---------- Mesin slide ---------- */
var deck = document.getElementById('deck'), current = 0, started = false;
function head() {
  return '<div class="head"><span class="brand"><img src="' + LOGO + '" alt="">PIP Machinery</span>' +
    '<span class="contact"><span class="hide-m">' + SENDER.name + ' · </span>' + SENDER.phone + '</span></div>';
}
function layoutFits() {
  [].forEach.call(document.querySelectorAll('.frag'), function (f) {
    var inner = f.firstElementChild, c = inner.firstElementChild;
    var w = c.offsetWidth, h = c.offsetHeight, bw = f.clientWidth, bh = f.clientHeight;
    if (!w || !h || !bw) return;
    var mode = f.dataset.mode, s;
    if (mode === 'contain') s = Math.min(bw / w, bh / h); else s = bw / w;
    if (mode === 'auto') f.style.height = Math.round(h * s) + 'px';
    inner.style.transform = 'scale(' + s + ')';
    inner.style.left = mode === 'contain' ? ((bw - w * s) / 2) + 'px' : '0px';
    inner.style.top = mode === 'contain' ? Math.max(0, (bh - h * s) / 2) + 'px' : '0px';
  });
}
function runCounts() {
  [].forEach.call(deck.querySelectorAll('.count'), function (el) {
    var to = +el.dataset.to, pre = el.dataset.prefix, suf = el.dataset.suffix, start = to > 100 ? to - 40 : 0, t0 = null;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / 900), e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + Math.round(start + (to - start) * e) + suf;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function drawCalc() {
  var el = document.getElementById('r-paket');
  if (!el) return;
  var paket = Math.ceil(5 / state.marginPaket);
  var bulan = BUNDLE / (state.customers * state.marginOrder / 1000);
  el.textContent = paket + ' paket';
  document.getElementById('r-bulan').textContent = bulan < 1 ? '< 1 bulan' : '± ' + Math.round(bulan) + ' bulan';
  document.getElementById('o-paket').textContent = juta(state.marginPaket);
  document.getElementById('o-cust').textContent = state.customers;
  document.getElementById('o-order').textContent = 'Rp ' + state.marginOrder + ' ribu';
}
function draw(keepFocusOn) {
  var s = SLIDES[current];
  document.body.style.background = s.theme === 'dark' ? 'var(--night)' : 'var(--paper)';
  deck.innerHTML = '<section class="slide ' + s.theme + (keepFocusOn ? ' on still' : '') + '" aria-label="' + s.title + '"><div class="frame">' + head() + '<div class="content">' + s.html() + '</div></div></section>';
  var sec = deck.firstElementChild;
  if (keepFocusOn) {
    [].forEach.call(sec.querySelectorAll('.rise,.line-draw,.bar-fill,.seq,.a-toast,.a-bar i'), function (el) { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; });
  } else {
    requestAnimationFrame(function () { sec.classList.add('on'); runCounts(); });
  }
  drawCalc();
  layoutFits();
  if (keepFocusOn) { var again = deck.querySelector(keepFocusOn); if (again) again.focus(); }
}
function go(i, fromHash) {
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  draw();
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === SLIDES.length - 1;
  document.getElementById('where').innerHTML = (current + 1) + ' / ' + SLIDES.length + ' <span>· ' + SLIDES[current].title + '</span>';
  document.getElementById('progress').style.width = ((current + 1) / SLIDES.length * 100) + '%';
  if (!fromHash) { try { history.replaceState(null, '', '#' + SLIDES[current].id); } catch (e) {} }
  window.scrollTo(0, 0);
  if (started) { var h = deck.querySelector('h1, h2'); if (h) h.focus({ preventScroll: true }); }
  started = true;
}
document.getElementById('prev').onclick = function () { go(current - 1); };
document.getElementById('next').onclick = function () { go(current + 1); };
deck.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t) return;
  var d = t.dataset;
  if (d.go) return go(d.go === 'next' ? current + 1 : +d.go);
  if (d.spread) { state.spread = d.spread; return draw('[data-spread="' + d.spread + '"]'); }
  if (d.role !== undefined) { state.role = +d.role; return draw('[data-role="' + d.role + '"]'); }
  if (d.admin) { state.adminView = d.admin; return draw('[data-admin="' + d.admin + '"]'); }
  if (d.paket !== undefined) { state.paket = +d.paket; return draw('[data-paket="' + d.paket + '"]'); }
  if (d.erp) { var inMock = !!t.closest('.erp'); state.erp = d.erp; draw(inMock ? '.erp-pick[data-erp="' + d.erp + '"]' : '[data-erp="' + d.erp + '"]'); var sec = deck.firstElementChild; sec.classList.add('on'); return; }
  if (d.pick !== undefined) { state.picks[+d.pick] = !state.picks[+d.pick]; return draw('[data-pick="' + d.pick + '"]'); }
  if (d.all) { state.picks = [true, true, true]; return draw('[data-all="1"]'); }
});
deck.addEventListener('input', function (e) {
  var id = e.target.id, v = +e.target.value;
  if (id === 'i-paket') state.marginPaket = v;
  if (id === 'i-cust') state.customers = v;
  if (id === 'i-order') state.marginOrder = v;
  drawCalc();
});
document.addEventListener('keydown', function (e) {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(current + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(current - 1);
});
var wasMobile = isMobile();
window.addEventListener('resize', function () {
  if (isMobile() !== wasMobile) { wasMobile = isMobile(); draw('h1, h2'); } else layoutFits();
});
window.addEventListener('load', layoutFits);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutFits);
deck.addEventListener('load', function (e) { if (e.target.tagName === 'IMG') layoutFits(); }, true);
function fromHash() {
  var id = location.hash.slice(1), i = SLIDES.map(function (s) { return s.id; }).indexOf(id);
  return i < 0 ? 0 : i;
}
window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== current) go(i, true); });
go(fromHash(), true);
</script>
