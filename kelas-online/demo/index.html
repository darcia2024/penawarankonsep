<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contoh Kelas Online · Dar Dev</title>
<meta name="description" content="Contoh tampilan website kelas online untuk tiap paket: Kelas Dasar, Kelas Lengkap, dan Akademi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6f4; --white: #fff; --ink: #17231b; --ink-2: #4b5d54; --faint: #73857c; --line: #e1e9e4;
    --t: #3d7179; --t-2: #2c5d64; --t-3: #234b51; --mint: #eaf4ef; --mint-2: #d3e7dc;
    --gold: #b38a45; --gold-soft: #f6efe1; --red: #b5523b; --red-soft: #f8ebe7; --ok: #2f7a55;
    --sans: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ar { font-family: "Amiri", "Traditional Arabic", serif; font-size: 1.35em; font-weight: 400; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--t); }

  /* Bar atas */
  .top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .in { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
  .dar { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; line-height: 1.2; flex: none; }
  .dar img { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; }
  .dar small { display: block; color: var(--faint); font-weight: 500; font-size: 12px; }
  .seg { margin-left: auto; display: flex; background: var(--mint); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--t-2); white-space: nowrap; line-height: 1.25; }
  .seg button small { display: block; font-size: 11px; font-weight: 500; opacity: .75; }
  .seg button.on { background: var(--t); color: #fff; box-shadow: 0 4px 10px -4px rgba(44,93,100,.6); }
  .back { font-size: 13px; font-weight: 600; color: var(--t-2); white-space: nowrap; flex: none; }

  /* Kerangka */
  .shell { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; align-items: start; }
  .side { position: sticky; top: 84px; display: grid; gap: 18px; }
  .side h4 { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px 10px; }
  .side button { width: 100%; display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); text-align: left; }
  .side button:hover { background: #fff; }
  .side button.on { background: #fff; color: var(--t-2); font-weight: 700; box-shadow: 0 1px 0 var(--line); }
  .side button .lk { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--gold); background: var(--gold-soft); border-radius: 99px; padding: 2px 8px; }
  .note { font-size: 12.5px; color: var(--faint); padding: 0 10px; line-height: 1.5; }

  .frame { background: var(--t); border-radius: 22px; padding: 14px; box-shadow: 0 30px 60px -40px rgba(35,75,81,.7); }
  .frame > .hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #fff; padding: 2px 6px 12px; }
  .frame > .hd .cap { color: rgba(255,255,255,.7); }
  .frame > .hd b { display: block; font-size: 17px; }
  .frame > .hd .who { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: .92; }
  .frame > .hd .who i { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 12px; }
  .scr { background: #fff; border-radius: 16px; padding: 26px; min-height: 560px; }

  /* Komponen layar */
  .h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .h small { display: block; color: var(--faint); font-size: 13px; }
  .h h2 { font-size: 24px; letter-spacing: -.01em; line-height: 1.2; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .box { border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .box.mint { background: var(--mint); border-color: var(--mint-2); }
  .box h3 { font-size: 16px; line-height: 1.3; }
  .box p { color: var(--ink-2); font-size: 14px; }
  .stat small { display: flex; justify-content: space-between; color: var(--faint); font-size: 12.5px; }
  .stat b { display: block; font-size: 22px; color: var(--t-2); margin-top: 2px; letter-spacing: -.01em; }
  .bar { height: 6px; border-radius: 99px; background: #fff; overflow: hidden; margin-top: 10px; }
  .box:not(.mint) .bar { background: var(--mint); }
  .bar i { display: block; height: 100%; background: var(--t); border-radius: 99px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--t); color: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn:hover { background: var(--t-2); }
  .btn.ghost { background: #fff; color: var(--t-2); box-shadow: inset 0 0 0 1px var(--mint-2); }
  .btn.ghost:hover { background: var(--mint); }
  .btn.sm { padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--mint); color: var(--t-2); white-space: nowrap; }
  .pill.wait { background: var(--gold-soft); color: #8a6526; }
  .pill.ok { background: #e3f3ea; color: var(--ok); }
  .rows { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .row .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--mint); color: var(--t-2); font-size: 11px; font-weight: 700; }
  .row .ic.pdf { background: #f6e9e1; color: #9a5a34; }
  .row .ic.q { background: var(--gold-soft); color: #8a6526; }
  .row b { display: block; font-size: 14px; font-weight: 600; }
  .row small { color: var(--faint); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  .tbl table tr:last-child td { border-bottom: 0; }
  .field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-weight: 500; background: #fff; color: var(--ink); width: 100%; }
  .sep { height: 1px; background: var(--line); margin: 22px 0; }

  /* Terkunci */
  .lock { max-width: 520px; margin: 50px auto; text-align: center; }
  .lock .ico { width: 64px; height: 64px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; margin: 0 auto 16px; }
  .lock .ico svg { width: 28px; height: 28px; }
  .lock h2 { font-size: 22px; line-height: 1.3; }
  .lock p { color: var(--ink-2); margin: 10px 0 20px; }
  .lock ul { text-align: left; display: grid; gap: 6px; margin: 0 auto 22px; max-width: 360px; font-size: 14px; color: var(--ink-2); }
  .lock li::before { content: "✓ "; color: var(--t); font-weight: 700; }

  /* Website bimbel */
  .site-hero { border-radius: 16px; background: linear-gradient(135deg, var(--mint), #f7fbf9); padding: 40px 34px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 26px; align-items: center; }
  .logo-ph { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--t-2); }
  .logo-ph i { width: 36px; height: 36px; border-radius: 10px; border: 1.5px dashed var(--t); display: grid; place-items: center; font-style: normal; font-size: 9px; color: var(--t); }
  .site-hero h1 { font-size: 34px; line-height: 1.12; letter-spacing: -.02em; color: var(--t-3); margin-top: 18px; }
  .site-hero p { color: var(--ink-2); margin-top: 12px; }
  .site-hero .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .sched { background: #fff; border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
  .sched div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
  .sched div:last-child { border: 0; padding: 0; }
  .prog h3 { margin-top: 8px; }
  .prog .price { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-weight: 700; color: var(--t-2); }

  /* Latihan */
  .q { border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .q h3 { font-size: 15.5px; font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .opts button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 500; }
  .opts button:hover:not(:disabled) { border-color: var(--t); }
  .opts button.ok { border-color: var(--ok); background: #e3f3ea; color: var(--ok); font-weight: 700; }
  .opts button.no { border-color: var(--red); background: var(--red-soft); color: var(--red); }
  .opts button:disabled { cursor: default; }
  .score { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--t); color: #fff; border-radius: 16px; padding: 16px 20px; }
  .score b { font-size: 36px; line-height: 1; }

  /* Pembayaran */
  .methods { display: flex; gap: 8px; flex-wrap: wrap; }
  .methods button { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14px; }
  .methods button.on { border-color: var(--t); background: var(--mint); color: var(--t-2); }
  .qr { width: 170px; height: 170px; border-radius: 12px; border: 1px solid var(--line); padding: 10px; background: #fff; }
  .paid { text-align: center; padding: 30px 10px; }
  .paid .ico { width: 64px; height: 64px; border-radius: 50%; background: #e3f3ea; color: var(--ok); display: grid; place-items: center; margin: 0 auto 14px; }
  .paid .ico svg { width: 30px; height: 30px; }

  /* Sertifikat */
  .cert { border: 1px solid var(--mint-2); border-radius: 16px; padding: 10px; background: var(--mint); }
  .cert .in { border: 1.5px solid var(--gold); border-radius: 10px; background: #fffdf8; padding: 36px 26px; text-align: center; }
  .cert .in .cap { color: var(--gold); }
  .cert h3 { font-size: 30px; letter-spacing: -.01em; color: var(--t-3); margin: 12px 0 6px; }
  .cert p { color: var(--ink-2); }
  .cert .sig { display: flex; justify-content: space-between; margin-top: 28px; font-size: 12.5px; color: var(--faint); text-align: center; }
  .cert .sig b { display: block; color: var(--ink); font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 26px; min-width: 150px; }

  /* Absensi */
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--t); margin-right: 3px; }
  .dot.x { background: #e6c9bf; }
  .dot.n { background: var(--line); }
  .hbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 13.5px; }
  .hbar span { height: 10px; border-radius: 99px; background: var(--mint); overflow: hidden; }
  .hbar span i { display: block; height: 100%; background: var(--t); }

  .pwa { display: flex; align-items: center; gap: 14px; background: var(--t-3); color: #fff; border-radius: 14px; padding: 14px 16px; }
  .pwa p { font-size: 13.5px; opacity: .85; }
  .pwa .btn { margin-left: auto; background: #fff; color: var(--t-3); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 960px) {
    .shell { grid-template-columns: minmax(0, 1fr); padding: 14px; }
    .side { position: relative; top: auto; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .side > div { display: contents; }
    .side h4, .note { display: none; }
    .side button { width: auto; white-space: nowrap; background: #fff; border: 1px solid var(--line); padding: 7px 12px; font-size: 13px; }
    .side button.on { border-color: var(--t); }
    .site-hero { grid-template-columns: minmax(0, 1fr); padding: 28px 22px; }
  }
  @media (max-width: 720px) {
    .top .in { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    .back { margin-left: auto; }
    .seg { order: 3; margin: 0; width: 100%; }
    .seg button { flex: 1; padding: 6px 4px; }
    .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
    .frame { padding: 8px; border-radius: 18px; }
    .frame > .hd { padding: 4px 6px 10px; }
    .frame > .hd .who span { display: none; }
    .scr { padding: 18px 14px; border-radius: 13px; }
    .site-hero h1 { font-size: 27px; }
    .row { grid-template-columns: 34px minmax(0, 1fr); }
    .row > :last-child { grid-column: 2; justify-self: start; }
    .hbar { grid-template-columns: 90px minmax(0, 1fr) 70px; font-size: 12.5px; }
    .pwa { flex-wrap: wrap; }
    .pwa .btn { margin-left: 0; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <a class="dar" href="../"><img src="../assets/dar-mascot-128.png" alt="Maskot Dar Dev" width="34" height="34"><span>Dar Dev<small>Contoh kelas online</small></span></a>
    <div class="seg" role="tablist" aria-label="Pilih paket">
      <button data-p="1">Kelas Dasar<small>Rp 3,5 juta</small></button>
      <button data-p="2">Kelas Lengkap<small>Rp 5 juta</small></button>
      <button data-p="3">Akademi<small>Rp 7,5 juta</small></button>
    </div>
    <a class="back" href="../#paket">← Penawaran</a>
  </div>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Halaman contoh"></nav>
  <main>
    <div class="frame">
      <div class="hd" id="fhd"></div>
      <div class="scr" id="scr"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const P = { 1: "Kelas Dasar", 2: "Kelas Lengkap", 3: "Akademi" };
const KEY = { dasar: 1, lengkap: 2, akademi: 3 };
const ic = {
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg>',
  lock: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
  cal: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  phone: '<svg class="i" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>'
};

const VIEWS = [
  { g: "Website bimbel", items: [
    { id: "web", t: "Beranda bimbel", who: "Calon murid", min: 1 },
    { id: "daftar", t: "Pendaftaran", who: "Calon murid", min: 1 } ] },
  { g: "Murid", items: [
    { id: "home", t: "Dashboard murid", who: "Murid", min: 1 },
    { id: "kelas", t: "Kelas dan materi", who: "Murid", min: 1 },
    { id: "bayar", t: "Pembayaran", who: "Murid", min: 1 },
    { id: "latihan", t: "Latihan soal", who: "Murid", min: 2 },
    { id: "sertifikat", t: "Sertifikat", who: "Murid", min: 2 },
    { id: "tryout", t: "Tryout", who: "Murid", min: 3 },
    { id: "rapor", t: "Rapor nilai", who: "Murid", min: 3 } ] },
  { g: "Admin dan pengajar", items: [
    { id: "adm", t: "Panel admin", who: "Admin", min: 1 },
    { id: "absen", t: "Progres dan absensi", who: "Pengajar", min: 2 },
    { id: "laporan", t: "Laporan dan honor", who: "Admin", min: 3 } ] }
];
const FLAT = VIEWS.flatMap(g => g.items);

const LOCKINFO = {
  latihan: ["Latihan soal dinilai otomatis", "Murid langsung tahu nilainya", "Nilai tersimpan untuk pengajar"],
  sertifikat: ["Sertifikat PDF terbit otomatis saat kelas selesai", "Nama murid dan kelas terisi sendiri"],
  absen: ["Progres belajar tiap murid", "Absensi live per pertemuan", "Rata-rata nilai latihan"],
  tryout: ["Tryout berwaktu, berhenti otomatis", "Peringkat peserta setelah tryout"],
  rapor: ["Rapor nilai per murid", "Bisa diunduh dan dikirim ke wali"],
  laporan: ["Laporan pemasukan per kelas", "Rekap honor pengajar", "Kupon dan harga promo"]
};

const qs = new URLSearchParams(location.search);
const S = {
  p: KEY[qs.get("paket")] || 2,
  v: FLAT.some(x => x.id === qs.get("v")) ? qs.get("v") : "web",
  method: "qris", paid: false, proof: false, coupon: false, cicil: false,
  confirmed: {}, answers: {}, timer: null
};

const $ = s => document.querySelector(s);
const rp = n => "Rp " + n.toLocaleString("id-ID");
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); }
function go(v) { S.v = v; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function setP(p) { S.p = p; S.paid = false; S.proof = false; render(); }

function syncUrl() {
  const name = Object.keys(KEY).find(k => KEY[k] === S.p);
  history.replaceState(null, "", "?paket=" + name + "&v=" + S.v);
}

function side() {
  $("#side").innerHTML = VIEWS.map(g => '<div><h4>' + g.g + '</h4>' + g.items.map(x =>
    '<button class="' + (x.id === S.v ? "on" : "") + '" data-v="' + x.id + '">' + x.t +
    (S.p < x.min ? '<span class="lk">' + (x.min === 2 ? "Lengkap" : "Akademi") + '</span>' : "") + '</button>'
  ).join("") + '</div>').join("") +
  '<p class="note">Fitur bertanda emas belum ada di paket ' + P[S.p] + '. Klik untuk melihat isinya.</p>';
}

function lockScreen(x) {
  const need = x.min === 2 ? 2 : 3;
  return '<div class="lock"><div class="ico">' + ic.lock + '</div>' +
    '<h2>' + x.t + ' ada mulai paket ' + P[need] + '</h2>' +
    '<p>Di paket ' + P[S.p] + ', halaman ini belum tersedia. Isinya:</p>' +
    '<ul>' + LOCKINFO[x.id].map(i => '<li>' + i + '</li>').join("") + '</ul>' +
    '<button class="btn" data-setp="' + need + '">Lihat di paket ' + P[need] + '</button></div>';
}

/* ---------- Layar ---------- */
const V = {};

V.web = () => `
  <div class="site-hero">
    <div>
      <span class="logo-ph"><i>LOGO</i>Bimbel Ustadz</span>
      <h1>Belajar bahasa Arab dan kitab dari dasar, langsung dengan ustadznya.</h1>
      <p>Kelas live tiap pekan, rekaman bisa ditonton ulang, dan modul PDF untuk setiap pertemuan.</p>

function qr() {
  let s = '<svg class="qr" viewBox="0 0 25 25" shape-rendering="crispEdges"><rect width="25" height="25" fill="#fff"/>';
  let seed = 7;
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const inF = (a, b) => (x >= a && x < a + 7 && y >= b && y < b + 7);
    if (inF(0, 0) || inF(18, 0) || inF(0, 18)) continue;
    seed = (seed * 9301 + 49297) % 233280;
    if (seed / 233280 > .52) s += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#17231b"/>';
  }
  [[0, 0], [18, 0], [0, 18]].forEach(f => { s += '<rect x="' + (f[0] + .5) + '" y="' + (f[1] + .5) + '" width="6" height="6" fill="none" stroke="#17231b"/><rect x="' + (f[0] + 2) + '" y="' + (f[1] + 2) + '" width="3" height="3" fill="#17231b"/>'; });
  return s + '</svg>';
}

    <div class="box mint" style="margin-top:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><p class="cap">Kupon aktif</p><p style="margin-top:4px"><b>HEMAT20</b> potongan 20%, berlaku sampai 30 November</p></div><button class="btn sm" data-toast="Admin bisa membuat kupon baru dan mengatur masa berlakunya">Buat kupon</button></div>`;
};

/* ---------- Render ---------- */
function render() {
  clearInterval(S.timer);
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", +b.dataset.p === S.p));
  const x = FLAT.find(i => i.id === S.v);
  side();
  const on = $("#side .on");
  if (on && window.innerWidth <= 960) { const s = $("#side"); s.scrollLeft = on.offsetLeft - (s.clientWidth - on.offsetWidth) / 2; }
  const locked = S.p < x.min;
  $("#fhd").innerHTML = '<div><p class="cap">' + (x.who === "Calon murid" ? "Website bimbel" : x.who === "Murid" ? "Ruang belajar" : "Panel bimbel") + '</p><b>' + x.t + '</b></div>' +
    '<span class="who"><span>' + (x.who === "Calon murid" ? "namabimbel.com" : x.who === "Murid" ? "Ahmad Fauzi" : x.who === "Pengajar" ? "Ust. Syahrul" : "Admin") + '</span><i>' + (x.who === "Calon murid" ? "www" : x.who === "Murid" ? "AF" : x.who === "Pengajar" ? "US" : "AD") + '</i></span>';
  $("#scr").innerHTML = locked ? lockScreen(x) : V[x.id]();
  if (!locked && x.id === "tryout") {
    let s = 45 * 60;
    S.timer = setInterval(() => { s--; const el = $("#tm"); if (!el) return clearInterval(S.timer); el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }, 1000);
  }
  syncUrl();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-act]");
  if (!b) return;
  const d = b.dataset;
  if (d.p) return setP(+d.p);
  if (d.setp) return setP(+d.setp);
  if (d.v) return go(d.v);
  if (d.go) return go(d.go);
  if (d.toast) return toast(d.toast);
  if (d.m) { S.method = d.m; return render(); }
  if (d.q) { S.answers[d.q] = d.o; return render(); }
  if (d.c) { S.confirmed[d.c] = true; toast("Pembayaran dikonfirmasi. Akses kelas murid terbuka."); return render(); }
  if (d.act === "proof") { S.proof = true; toast("Bukti terkirim. Admin mendapat notifikasi."); return render(); }
  if (d.act === "pay") { S.paid = true; return render(); }
  if (d.act === "reset") { S.answers = {}; return render(); }
  if (d.act === "coupon") {
    const v = ($("#kupon").value || "").trim().toUpperCase();
    if (v === "HEMAT20") { S.coupon = true; toast("Kupon dipakai, potongan 20%"); } else toast("Kode kupon tidak dikenal. Coba HEMAT20");
    return render();
  }
});
document.addEventListener("change", e => { if (e.target.dataset.act === "cicil") { S.cicil = e.target.checked; render(); } });

render();
</script>
</body>
</html>
