<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumah Nahwu · Bimbel Bahasa Arab dan Kitab</title>
<meta name="description" content="Contoh website kelas online dari Dar Dev: website bimbel, ruang belajar murid, dan panel admin.">
<meta name="theme-color" content="#2c5d64">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f5; --white: #fff; --ink: #142019; --ink-2: #44574d; --faint: #75877e; --line: #e2eae5; --line-2: #d3e0d8;
    --t: #3d7179; --t-2: #2c5d64; --t-3: #1f454b; --t-4: #173438; --mint: #eaf4ef; --mint-2: #d3e7dc;
    --gold: #b38a45; --gold-2: #d9b874; --gold-soft: #f7f0e2; --red: #b5523b; --red-soft: #fbece8; --ok: #2f7a55; --ok-soft: #e3f3ea;
    --sans: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    --shadow: 0 1px 2px rgba(20,32,25,.04), 0 8px 24px -12px rgba(20,32,25,.12);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ar { font-family: "Amiri", "Traditional Arabic", serif; font-weight: 400; font-size: 1.3em; line-height: 1.2; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--t); }
  .muted { color: var(--faint); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  /* Tombol dan komponen */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 20px; background: var(--t-2); color: #fff; font-weight: 600; font-size: 14.5px; line-height: 1.2; white-space: nowrap; transition: background .2s, transform .2s; }
  .btn:hover { background: var(--t-3); }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: #fff; color: var(--t-2); box-shadow: inset 0 0 0 1px var(--line-2); }
  .btn.ghost:hover { background: var(--mint); }
  .btn.soft { background: var(--mint); color: var(--t-2); }
  .btn.soft:hover { background: var(--mint-2); }
  .btn.gold { background: var(--gold-2); color: var(--t-4); }
  .btn.sm { padding: 7px 13px; font-size: 13px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .55; cursor: default; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--mint); color: var(--t-2); white-space: nowrap; }
  .pill.wait { background: var(--gold-soft); color: #8a6526; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.gray { background: #eef1ef; color: var(--ink-2); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .card.mint { background: var(--mint); border-color: var(--mint-2); }
  .card h3 { font-size: 16px; line-height: 1.35; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .bar { height: 6px; border-radius: 99px; background: var(--mint); overflow: hidden; }
  .card.mint .bar { background: #fff; }
  .bar i { display: block; height: 100%; background: var(--t); border-radius: 99px; }
  .field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select, .field textarea { border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 13px; font-weight: 500; font-size: 14.5px; background: #fff; color: var(--ink); width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--t); box-shadow: 0 0 0 3px rgba(61,113,121,.15); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fafcfb; white-space: nowrap; }
  td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .tbl { background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .tbl .scroll { overflow-x: auto; }
  .tbl .tb { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tbl .tb h3 { font-size: 15.5px; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: #fff; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who b { display: block; font-weight: 600; font-size: 14px; line-height: 1.3; }
  .who small { color: var(--faint); font-size: 12.5px; }

  /* Logo bimbel */
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; color: var(--t-3); }
  .brand svg { width: 36px; height: 36px; flex: none; }
  .brand small { display: block; font-size: 11.5px; font-weight: 500; color: var(--faint); letter-spacing: 0; line-height: 1.2; }

  /* ===== Website bimbel ===== */
  .snav { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .snav .wrap { display: flex; align-items: center; gap: 28px; height: 70px; }
  .snav nav { display: flex; gap: 26px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
  .snav nav a:hover { color: var(--t-2); }
  .snav .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .snav .r a.in { font-weight: 600; font-size: 14.5px; color: var(--t-2); padding: 0 10px; }
  .hero { background: radial-gradient(1000px 420px at 85% -10%, #dcece4 0%, transparent 60%), linear-gradient(180deg, #f3f9f6, var(--bg)); padding: 70px 0 90px; overflow: hidden; }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: center; }
  .hero h1 { font-size: clamp(38px, 5vw, 60px); line-height: 1.04; letter-spacing: -.035em; color: var(--t-3); font-weight: 700; margin-top: 16px; }
  .hero h1 em { font-style: normal; color: var(--gold); }
  .hero p.lead { font-size: 17.5px; color: var(--ink-2); margin-top: 18px; max-width: 32em; }
  .hero .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  .hero .ok { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 26px; font-size: 13.5px; color: var(--ink-2); }
  .hero .ok span { display: inline-flex; gap: 7px; align-items: center; }
  .hero .ok svg { color: var(--t); width: 16px; height: 16px; }
  .hcard { background: var(--t-2); border-radius: 26px; padding: 16px; box-shadow: 0 40px 80px -40px rgba(31,69,75,.65); position: relative; }
  .hcard .hd { display: flex; justify-content: space-between; color: #fff; padding: 2px 6px 14px; }
  .hcard .hd .cap { color: rgba(255,255,255,.65); }
  .hcard .hd b { display: block; font-size: 16px; }
  .hcard .in { background: #fff; border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
  .live-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid var(--line); }
  .live-row .d { text-align: center; background: var(--mint); border-radius: 12px; padding: 6px 0; line-height: 1.15; color: var(--t-2); }
  .live-row .d b { display: block; font-size: 18px; }
  .live-row .d small { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .live-row h4 { font-size: 14.5px; }
  .live-row p { font-size: 12.5px; color: var(--faint); }
  .float-badge { position: absolute; left: -26px; bottom: -30px; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .float-badge b { display: block; font-size: 18px; color: var(--t-2); line-height: 1.1; }
  .float-badge .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; }
  .sec { padding: 96px 0 0; }
  .sec-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 34px; }
  .sec-h h2 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.1; letter-spacing: -.03em; color: var(--t-3); margin-top: 10px; max-width: 16em; }
  .sec-h p { color: var(--ink-2); max-width: 30em; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .filters button { padding: 8px 16px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); background: #fff; border: 1px solid var(--line); }
  .filters button.on { background: var(--t-2); color: #fff; border-color: var(--t-2); }
  .prog { background: #fff; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s; }
  .prog:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .thumb { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; color: var(--gold-2); }
  .thumb .ar { font-size: 48px; font-weight: 700; text-shadow: 0 2px 20px rgba(0,0,0,.2); }
  .thumb .tag { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.92); color: var(--t-3); border-radius: 99px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px); }
  .th1 { background: linear-gradient(135deg, #1f454b, #3d7179); }
  .th2 { background: linear-gradient(135deg, #3a3a28, #7a6a3a); }
  .th3 { background: linear-gradient(135deg, #22382c, #3f6b52); }
  .th4 { background: linear-gradient(135deg, #3b2a2a, #7a4f42); }
  .prog .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .prog h3 { font-size: 17px; letter-spacing: -.01em; }
  .prog p { font-size: 14px; color: var(--ink-2); }
  .prog .meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--faint); margin-top: 4px; flex-wrap: wrap; }
  .prog .meta span { display: inline-flex; gap: 5px; align-items: center; }
  .prog .meta svg { width: 14px; height: 14px; }
  .prog .foot { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; }
  .prog .foot small { display: block; font-size: 11px; color: var(--faint); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .prog .foot b { font-size: 18px; color: var(--t-2); }
  .teach { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; }
  .teach .av { width: 64px; height: 64px; font-size: 20px; }
  .teach h3 { font-size: 16px; }
  .teach p { font-size: 13.5px; color: var(--ink-2); }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; counter-reset: s; }
  .steps li { counter-increment: s; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .steps li::before { content: "0" counter(s); display: block; font-size: 13px; font-weight: 800; color: var(--gold); letter-spacing: .08em; margin-bottom: 14px; }
  .steps b { display: block; font-size: 16px; color: var(--t-3); }
  .steps p { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
  .quote { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .quote p { font-size: 15.5px; color: var(--ink); }
  .faqs { display: grid; gap: 10px; max-width: 820px; }
  .faqs details { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 0 20px; }
  .faqs summary { list-style: none; cursor: pointer; padding: 18px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 16px; }
  .faqs summary::-webkit-details-marker { display: none; }
  .faqs summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--t); transition: transform .2s; }
  .faqs details[open] summary::after { transform: rotate(45deg); }
  .faqs p { padding: 0 0 18px; color: var(--ink-2); font-size: 14.5px; }
  .cta { margin-top: 96px; background: var(--t-3); color: #fff; border-radius: 30px; padding: 56px 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; position: relative; overflow: hidden; }
  .cta::after { content: "عِلْم"; position: absolute; right: 220px; bottom: -40px; font-family: "Amiri", serif; font-size: 200px; color: rgba(255,255,255,.05); line-height: 1; }
  .cta h2 { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; letter-spacing: -.03em; max-width: 15em; }
  .cta p { opacity: .8; margin-top: 10px; }
  .sfoot { margin-top: 70px; border-top: 1px solid var(--line); background: #fff; }
  .sfoot .wrap { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 32px; padding-top: 48px; padding-bottom: 40px; }
  .sfoot h4 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .sfoot li { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
  .sfoot .copy { border-top: 1px solid var(--line); padding: 18px 24px; text-align: center; font-size: 13px; color: var(--faint); }

  /* Halaman daftar / bayar / masuk */
  .plain { min-height: 100vh; display: flex; flex-direction: column; }
  .plain header { background: #fff; border-bottom: 1px solid var(--line); }
  .plain header .wrap { height: 66px; display: flex; align-items: center; justify-content: space-between; }
  .checkout { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; width: 100%; }
  .stepper { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--faint); margin-bottom: 18px; flex-wrap: wrap; }
  .stepper span { display: inline-flex; gap: 7px; align-items: center; }
  .stepper i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--line-2); font-style: normal; font-size: 12px; }
  .stepper .on { color: var(--t-2); }
  .stepper .on i { background: var(--t-2); color: #fff; border-color: var(--t-2); }
  .stepper .done i { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-soft); }
  .stepper .ln { width: 26px; height: 1px; background: var(--line-2); }
  .checkout h1 { font-size: 28px; letter-spacing: -.02em; color: var(--t-3); line-height: 1.2; }
  .opt-list { display: grid; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line-2); border-radius: 16px; padding: 14px 16px; background: #fff; text-align: left; width: 100%; }
  .opt .rd { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; }
  .opt.on { border-color: var(--t); box-shadow: 0 0 0 3px rgba(61,113,121,.12); }
  .opt.on .rd { border-color: var(--t); background: var(--t); box-shadow: inset 0 0 0 3px #fff; }
  .opt b { display: block; font-size: 14.5px; }
  .opt small { color: var(--faint); font-size: 12.5px; }
  .opt .logos { margin-left: auto; display: flex; gap: 4px; }
  .opt .logos span { font-size: 10px; font-weight: 800; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; color: var(--ink-2); background: #fafcfb; }
  .summary { position: sticky; top: 24px; }
  .summary .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 6px 0; }
  .summary .tot { border-top: 1px dashed var(--line-2); margin-top: 8px; padding-top: 14px; font-weight: 700; }
  .summary .tot b { font-size: 22px; color: var(--t-2); }
  .qr { width: 190px; height: 190px; border-radius: 14px; border: 1px solid var(--line); padding: 10px; background: #fff; }
  .upload { border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 26px; text-align: center; background: #fafcfb; display: grid; gap: 8px; place-items: center; }
  .upload .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--mint); color: var(--t-2); display: grid; place-items: center; }
  .done-box { text-align: center; max-width: 480px; margin: 60px auto; padding: 0 24px; }
  .done-box .ic { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; }
  .done-box .ic svg { width: 34px; height: 34px; }
  .done-box h1 { font-size: 28px; color: var(--t-3); letter-spacing: -.02em; }
  .done-box p { color: var(--ink-2); margin: 10px 0 24px; }
  .login { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .login .art { background: var(--t-3); color: #fff; padding: 60px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .login .art .ar.big { font-size: 140px; color: rgba(217,184,116,.18); position: absolute; right: -10px; top: 40px; line-height: 1; }
  .login .art h2 { font-size: 34px; line-height: 1.15; letter-spacing: -.03em; max-width: 12em; position: relative; }
  .login .art p { opacity: .75; margin-top: 12px; max-width: 26em; position: relative; }
  .login .frm { display: grid; place-items: center; padding: 40px 24px; background: #fff; }
  .login .frm > div { width: 100%; max-width: 380px; display: grid; gap: 16px; }
  .login h1 { font-size: 26px; color: var(--t-3); letter-spacing: -.02em; }
  .role { display: grid; grid-template-columns: 1fr 1fr; background: var(--mint); border-radius: 14px; padding: 4px; }
  .role button { padding: 9px; border-radius: 11px; font-weight: 600; font-size: 14px; color: var(--t-2); }
  .role button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* ===== Aplikasi (murid & admin) ===== */
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
  .sb { background: #fff; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 14px; overflow-y: auto; }
  .sb .brand { padding: 0 8px 22px; }
  .sb .grp { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 14px 12px 8px; }
  .sb a.it { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); }
  .sb a.it:hover { background: var(--bg); color: var(--ink); }
  .sb a.it.on { background: var(--mint); color: var(--t-2); font-weight: 700; }
  .sb a.it .n { margin-left: auto; background: var(--gold-2); color: var(--t-4); font-size: 11px; font-weight: 800; border-radius: 99px; padding: 1px 7px; }
  .sb .me { margin-top: auto; border-top: 1px solid var(--line); padding: 16px 8px 0; }
  .sb .me a { font-size: 13px; color: var(--faint); display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; }
  .sb .me a svg { width: 15px; height: 15px; }
  .main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 15; height: 66px; background: rgba(244,247,245,.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 28px; }
  .topbar .menu, .tbrand { display: none; }
  .tbrand { align-items: center; gap: 8px; font-weight: 800; color: var(--t-3); font-size: 15.5px; }
  .tbrand svg { width: 30px; height: 30px; }
  .search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; color: var(--faint); font-size: 14px; }
  .search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; }
  .topbar .r { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    html = shell(area, page, map[page](sub));

  } else if (area === "daftar") html = daftar();
  else if (area === "bayar") html = bayar();

  else { html = site(); document.title = "Rumah Nahwu · Bimbel Bahasa Arab dan Kitab"; }
  $("#root").innerHTML = html;
  if (area === "murid" && page === "tryout" && S.to.on) S.timer = setInterval(() => { S.to.s--; const el = $("#tm"); if (el) el.textContent = fmt(S.to.s); }, 1000);
  document.querySelectorAll("#swPnl .pk button").forEach(b => b.classList.toggle("on", +b.dataset.p === S.p));
  $("#swLbl").textContent = "Contoh · " + PK[S.p];
  const name = Object.keys(PKEY).find(k => PKEY[k] === S.p);
  history.replaceState(null, "", "?paket=" + name + location.hash);
  if (S.modal) openProof(S.modal);
}
function openProof(i) {
  const r = PAYS[i];
  const m = document.createElement("div");
  m.className = "modal"; m.dataset.act = "closeModal";
  m.innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><b>Bukti transfer · ${r[0]}</b><button class="icbtn" data-act="closeModal" aria-label="Tutup">✕</button></div>
    <div class="receipt"><p style="text-align:center;font-weight:700">BSI Mobile</p><p class="muted" style="text-align:center;font-size:12px">Transfer berhasil</p><div class="big">Rp 100.000</div>
      <div class="row"><span class="muted">Ke</span><span>7123 4567 89 · Rumah Nahwu</span></div><div class="row"><span class="muted">Dari</span><span>${r[0]}</span></div><div class="row"><span class="muted">Waktu</span><span>${r[2]}</span></div><div class="row"><span class="muted">Berita</span><span>${r[1]}</span></div></div>
    <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" data-act="closeModal">Tutup</button><button class="btn" style="flex:1" data-conf="${i}">Konfirmasi</button></div></div>`;
  document.body.appendChild(m);
}
window.addEventListener("hashchange", () => { S.modal = null; document.querySelectorAll(".modal").forEach(m => m.remove()); render(); window.scrollTo(0, 0); });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-p],[data-act],[data-toast],[data-filter],[data-cls],[data-pay],[data-role],[data-tab],[data-les],[data-ch],[data-to],[data-conf],[data-proof],#swBtn");
  if (!el) { if (!e.target.closest("#sw")) $("#swPnl").hidden = true; return; }
  const d = el.dataset;
  if (el.id === "swBtn") { const p = $("#swPnl"); p.hidden = !p.hidden; el.setAttribute("aria-expanded", String(!p.hidden)); return; }
  if (d.p) { S.p = +d.p; S.paid = S.proof = S.coupon = S.cicil = false; S.confirmed = {}; S.to.on = false; render(); toast("Sekarang menampilkan paket " + PK[S.p]); return; }
  if (d.cls) { S.cls = d.cls; return; }
  if (d.toast !== undefined && !d.act) return toast(d.toast);
  if (d.filter) { S.filter = d.filter; return render(); }
  if (d.pay) { S.pay = d.pay; return render(); }
  if (d.role) { S.role = d.role; return render(); }
  if (d.tab) { S.tab = d.tab; return render(); }
  if (d.les) { S.lesson = +d.les; S.tab = "materi"; render(); return window.scrollTo({ top: 0, behavior: "smooth" }); }
  if (d.ch) { S.ans[S.qi] = +d.ch; return render(); }
  if (d.to) { S.to.a[S.to.cur] = +d.to; return render(); }
  if (d.proof) { S.modal = d.proof; return openProof(+d.proof); }
  if (d.conf) { S.confirmed[d.conf] = true; S.modal = null; document.querySelectorAll(".modal").forEach(m => m.remove()); toast("Pembayaran dikonfirmasi. Murid mendapat pesan WhatsApp dan kelasnya terbuka."); return render(); }
  switch (d.act) {
    case "open": $("#app").classList.add("open"); break;
    case "close": $("#app").classList.remove("open"); break;
    case "closeModal": if (e.target === el) { S.modal = null; document.querySelectorAll(".modal").forEach(m => m.remove()); } break;
    case "proof": S.proof = true; render(); break;
    case "pay": S.paid = true; render(); break;
    case "coupon": { const v = ($("#kupon").value || "").trim().toUpperCase(); if (v === "HEMAT20") { S.coupon = true; toast("Kupon HEMAT20 dipakai, hemat Rp 20.000"); } else toast("Kode kupon tidak ditemukan. Coba HEMAT20"); render(); break; }
    case "prev": if (S.qi > 0) { S.qi--; render(); } break;
    case "next": if (S.qi < QUIZ.length - 1) S.qi++; else S.quizDone = true; render(); break;
    case "retry": S.ans = {}; S.qi = 0; S.quizDone = false; render(); break;
    case "startTo": S.to.on = true; S.to.s = 45 * 60; render(); break;
    case "toPrev": if (S.to.cur > 1) { S.to.cur--; render(); } break;
    case "toNext": if (S.to.cur < 20) { S.to.cur++; render(); } break;
    case "endTo": S.to.on = false; render(); toast("Tryout terkumpul. Nilai dan peringkat keluar setelah tryout ditutup."); break;
  }
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.act === "cicil") { S.cicil = e.target.checked; render(); }
  if (d.act === "cls") { S.cls = e.target.value; render(); }
});
render();
</script>
</body>
