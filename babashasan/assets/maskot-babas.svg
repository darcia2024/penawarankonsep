<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Maskot Bang Babas: gaya garis seperti maskot Dar, rambut pendek rapi, tanpa peci dan janggut -->
  <rect width="128" height="128" fill="#f6f1e6"/>
  <g transform="translate(64 70) scale(1.2) translate(-64 -70)">
    <g stroke="#151513" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- baju koko -->
      <path d="M24 130c3-15 16-23 40-23s37 8 40 23z" fill="#fff"/>
      <path d="M55 107l9 11 9-11" fill="none"/>
      <!-- telinga -->
      <path d="M36 67c-6-1-8 4-6 9s5 6 8 5" fill="#fff"/>
      <path d="M92 67c6-1 8 4 6 9s-5 6-8 5" fill="#fff"/>
      <!-- wajah -->
      <path d="M36 63c0-18 12-30 28-30s28 12 28 30c0 26-11 44-28 44S36 89 36 63z" fill="#fff"/>
      <!-- rambut pendek, belah samping -->
      <path d="M34 64c-2-20 10-34 30-34 19 0 32 12 30 32-1 3-2 5-3 6-1-8-5-13-10-15-8 3-19 4-30 3-6 0-11 2-14 6-1 1-2 2-3 2z" fill="#151513"/>
    </g>
    <!-- kilau rambut -->
    <path d="M52 37c5-2 12-3 18-1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <g fill="none" stroke="#151513" stroke-width="2.8" stroke-linecap="round">
      <!-- alis -->
      <path d="M46 67c3-1.5 6-1.5 9 0"/><path d="M73 67c3-1.5 6-1.5 9 0"/>
      <!-- mata senyum -->
      <path d="M46.5 76c2.5-3 6-3 8.5 0"/><path d="M73 76c2.5-3 6-3 8.5 0"/>
      <!-- hidung -->
      <path d="M64 76c-1 3.5-2 5.5 1 6.5"/>
      <!-- kumis tipis -->
      <path d="M55 87c3-2.5 6-2.5 9-.5 3-2 6-2 9 .5" stroke-width="3.4"/>
    </g>
    <!-- senyum -->
    <path d="M57 93c4 3.5 10 3.5 14 0" fill="none" stroke="#151513" stroke-width="2.8" stroke-linecap="round"/>
    <!-- pipi -->
    <circle cx="47" cy="85" r="3.2" fill="#e9c9b0"/><circle cx="81" cy="85" r="3.2" fill="#e9c9b0"/>
  </g>
</svg>
